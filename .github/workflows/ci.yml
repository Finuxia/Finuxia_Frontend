name: CI

# Runs on EVERY branch, not only main and develop (OPS-07).
#
# For most of this project's life CI never ran on a feature branch at all. The push trigger covered
# only main and develop, the pull_request trigger needs a pull request to exist, and branches were
# pushed and handed over for review without one. So every branch arrived having run only on its
# author's machine.
#
# Widening the push trigger rather than mandating pull requests, deliberately. A trigger cannot be
# forgotten; a process step can, and forgetting it is exactly what happened.
on:
  push:
    branches: ["**"]
  pull_request:
  # Manual run, so the environment can be updated without waiting for the full gate.
  #
  # skip_checks is deliberately NOT reachable from a push. A deploy triggered by pushing always runs
  # the suite, the static checks and the build first, because "a deploy cannot happen on a red
  # suite" is most of what this pipeline is for. The escape hatch is an explicit tick-box recorded
  # in the run's inputs rather than a default, so skipping is a decision somebody made and can be
  # seen to have made.
  workflow_dispatch:
    inputs:
      skip_checks:
        description: "Deploy without running the tests, static checks or build"
        type: boolean
        default: false

# A branch in this repository with an open pull request matches both triggers above. Grouping a push
# and its pull request under one key means the duplicate is cancelled rather than paid for twice, and
# a rapid series of pushes to one branch does not leave redundant runs queued.
#
# main and develop are exempt from cancellation: every commit on them should end with a completed
# result rather than a cancelled one.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

jobs:
  # Required check: make "test" a required status check for main and develop in the repository's
  # branch protection settings. Still not done — it needs repository admin access, not a code change.
  test:
    # Two ways to skip, both deliberate and both leaving a record: `[skip tests]` in the commit
    # message for a push, or the skip_checks tick-box on a manual run. See the long note in the
    # backend repository's workflow for why it is a commit-message token rather than a repository
    # variable — in short, a variable is a switch nobody remembers to flip back, while a token is
    # per-commit and countable with `git log --grep`.
    if: >-
      ${{
        !(github.event_name == 'workflow_dispatch' && inputs.skip_checks)
        && !contains(github.event.head_commit.message, '[skip tests]')
      }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test (with the coverage floor)
        run: npm run test:coverage

  # Static checks (FE-09). Lint runs with zero warnings and every suppression needs a written reason (see eslint.config.js); the formatter and the
  # type check (JSDoc types over src/lib, src/hooks and src/services, see tsconfig.json) must pass too. Run all four locally with `npm run check`.
  static:
    if: >-
      ${{
        !(github.event_name == 'workflow_dispatch' && inputs.skip_checks)
        && !contains(github.event.head_commit.message, '[skip tests]')
      }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint (zero warnings; every suppression needs a written reason)
        run: npm run lint
      - name: Formatting
        run: npm run format:check
      - name: Type check (shared library modules, JSDoc types)
        run: npm run typecheck

  build:
    if: >-
      ${{
        !(github.event_name == 'workflow_dispatch' && inputs.skip_checks)
        && !contains(github.event.head_commit.message, '[skip tests]')
      }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          VITE_API_URL: https://api.example.invalid
      - name: Bundle check (public pages and first load exclude the signed-in app; size budget)
        run: npm run check:bundle
      - name: Dependency audit (fail on high and critical)
        # The full audit is meaningful again after SEC-10: npm exits non-zero only for high or
        # critical findings, while the two known moderate production findings remain visible but
        # non-blocking. They are uuid <11.1.1 via exceljs; npm's suggested fix downgrades exceljs to
        # 3.4.0, which would undo SEC-04's replacement of the vulnerable xlsx parser. Review by
        # 2027-01-15, or sooner if exceljs ships a compatible uuid update. Never use --force here.
        run: npm audit --audit-level=high

  # Deploys to Cloud Run on every push to develop (OPS-16).
  #
  # IN THIS WORKFLOW rather than a separate one, and gated on all three jobs above. A deploy cannot
  # start unless the suite, the static checks and the build all passed on this exact commit, in this
  # exact run. A second workflow triggered by the first completing would have let them drift, and
  # the failure mode there is silent: a deploy that fires after a red run.
  #
  # Before this, deploying meant a person running `gcloud run deploy --source .` from Cloud Shell
  # after cloning with a personal access token. The result was no link between a commit and what was
  # serving, no rollback, and nothing preventing a deploy while CI was red.
  #
  # NO SERVICE ACCOUNT KEY. Workload Identity Federation: GitHub presents a short-lived OIDC token,
  # Google exchanges it for a short-lived access token, and the exchange is restricted to this
  # repository. A JSON key in a GitHub secret would be a permanent credential to a production
  # project with no expiry and no revocation story.
  #
  # The image is built here rather than by `gcloud run deploy --source`, so the build log is in
  # Actions where the team looks, and the image carries the commit SHA as its tag.
  #
  # Note the Dockerfile reads .env.production for VITE_API_URL, which is why that file is committed.
  # The `build` job above deliberately builds with a bogus host instead, to prove nothing real is
  # baked in by accident — the two are not duplicates, they answer different questions.
  deploy:
    needs: [test, static, build]
    # `always()` is required, not decoration: without it SKIPPED upstream jobs would skip this one
    # too, so a manual run with skip_checks ticked would do nothing at all. With it, the outcomes
    # that may proceed are stated explicitly — passed, or deliberately skipped — and any FAILED job
    # still blocks the deploy.
    if: >-
      always()
      && github.ref == 'refs/heads/develop'
      && (needs.test.result == 'success' || needs.test.result == 'skipped')
      && (needs.static.result == 'success' || needs.static.result == 'skipped')
      && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    # id-token is what lets the job mint the OIDC token WIF exchanges. Without it the auth step
    # fails with a message that does not mention permissions.
    permissions:
      contents: read
      id-token: write
    # Nothing about this project is written into the workflow. Every value comes from repository
    # secrets, so the file is portable and says nothing about where it deploys. Consequence worth
    # knowing: GitHub masks secrets in logs, so the service name and URL print as *** below.
    env:
      PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      REGION: ${{ secrets.GCP_REGION }}
      SERVICE: ${{ secrets.CLOUD_RUN_SERVICE }}
      RUNTIME_SA: ${{ secrets.CLOUD_RUN_RUNTIME_SA }}
      REPOSITORY: ${{ secrets.GCP_AR_REPOSITORY }}
    steps:
      - uses: actions/checkout@v5

      # Stops an older commit overwriting a newer one in production. `develop` is exempt from the
      # cancel-in-progress rule above on purpose, so two runs can be in flight and the earlier one
      # can reach its deploy step later — quietly reverting the service to older code, with nothing
      # announcing it. A concurrency group would not help: with cancel-in-progress the last job to
      # arrive wins, and here the late arrival is the stale one. See the longer note in the backend
      # repository's workflow.
      - name: Refuse to deploy a commit that is no longer the tip of the branch
        run: |
          git fetch --depth 1 origin "${GITHUB_REF_NAME}"
          TIP="$(git rev-parse FETCH_HEAD)"
          if [ "$TIP" != "$GITHUB_SHA" ]; then
            echo "::error::${GITHUB_REF_NAME} has moved on to $TIP. This run is for $GITHUB_SHA," \
                 "so deploying it would replace newer code with older. Refusing."
            exit 1
          fi
          echo "$GITHUB_SHA is still the tip of ${GITHUB_REF_NAME}."

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Authenticate Docker to Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      # An unset secret produces an empty path segment rather than an obvious error: a missing
      # REPOSITORY yields "region-docker.pkg.dev/project//service" and docker reports "invalid
      # reference format", which is what happened on the first run of this job and says nothing
      # about which value is missing. Checking first turns that into a sentence naming the secret.
      - name: Check the deployment secrets are all set
        run: |
          missing=""
          for v in PROJECT_ID REGION SERVICE RUNTIME_SA REPOSITORY; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::These repository secrets are empty or unset:$missing"
            exit 1
          fi

      - name: Build and push the image
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${SERVICE}:${GITHUB_SHA}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      # Deploying by image with no --set-env-vars PRESERVES the service's existing configuration.
      # The pipeline ships code; the environment stays where it is managed. A pipeline that also
      # rewrote configuration could wipe a setting nobody had put in the repository.
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" \
            --region "$REGION" \
            --service-account "$RUNTIME_SA" \
            --quiet

      - name: Report what is running
        run: |
          echo "Deployed ${GITHUB_SHA} to $SERVICE"
          gcloud run services describe "$SERVICE" --region "$REGION" \
            --format='value(status.url,status.latestReadyRevisionName)'
