# Response headers applied to every location.
#
# WHY THIS IS A SEPARATE FILE. nginx's `add_header` is not inherited into a location that sets its
# own, so each location has to repeat the full set. nginx.conf previously held two copies and a
# comment apologising for it; adding an index.html location would have made three, and three copies
# of a security policy is three chances for them to drift apart silently — the kind of drift where
# one path quietly loses its Content-Security-Policy and nothing fails.
#
# Included rather than placed in /etc/nginx/conf.d/ deliberately: everything matching
# conf.d/*.conf is auto-loaded by the main nginx config as top-level configuration, which is not
# what this is.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# One year, matching the backend's SECURE_HSTS_SECONDS. It was 3600 here — one hour, which is close
# to pointless, because the entire value of HSTS is the browser remembering it between visits.
# Raising it is hard to undo (browsers honour the previous value for its full duration), which is
# the argument for getting it right rather than leaving it short.
add_header Strict-Transport-Security "max-age=31536000" always;

add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# connect-src and img-src name the API host explicitly: with the frontend on finuxia.com and the API
# on api2.finuxia.com, 'self' does not cover it, and getting this wrong does not break the build —
# the app loads, renders, and then the browser silently blocks every request to the API.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://api2.finuxia.com; connect-src 'self' https://api2.finuxia.com; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
