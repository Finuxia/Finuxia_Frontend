# finuxia.ca and finuxia.org used to serve the old version of the app from this service. The app now lives at https://finuxia.com, so every request here
# is sent there, with its path and query. Nothing else is served.
server {
    listen 8080;
    server_name _;

    location / {
        return 301 https://finuxia.com$request_uri;
    }
}
