server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # See nginx-security-headers.conf for why these live in an included file rather than being
    # repeated in each location.
    include /etc/nginx/snippets/security-headers.conf;

    # THE TWO CACHE POLICIES BELOW ARE A PAIR. Getting one without the other is what produces a
    # white screen after a deploy.
    #
    # Vite fingerprints everything under /assets/, so a given filename's contents never change and
    # it can be cached forever. index.html is NOT fingerprinted: it is the one file whose contents
    # change on every deploy, and it is the file that names which fingerprinted assets to fetch.
    #
    # Cache index.html and a visitor keeps an old copy pointing at asset filenames that no longer
    # exist. The result is a blank page with console errors, affecting precisely the people who
    # visited most recently, clearing itself at an unpredictable moment. This happened twice while
    # standing up finuxia.com — both times a stale cached response for an asset path, both times
    # fixed by purging Cloudflare, which is not a thing to rely on doing after every deploy.
    #
    # no-cache does not mean "do not store": it means revalidate before use. The browser and
    # Cloudflare still keep a copy and still send a conditional request, so an unchanged index.html
    # costs a 304 rather than a full download. The deploy becomes visible immediately and the
    # bandwidth saving is kept.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Long-cache the fingerprinted assets Vite emits.
    #
    # One Cache-Control header, not two. `expires 1y;` emits its own Cache-Control, so combining it
    # with add_header sent the response with both `max-age=31536000` and `public, immutable` as
    # separate headers. Browsers cope, but two headers controlling one thing is ambiguous and the
    # next person to adjust it would change one and not the other.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # SPA fallback — every unknown path serves index.html so client routing works. The internal
    # redirect re-enters location matching, so the no-cache policy above still applies.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
